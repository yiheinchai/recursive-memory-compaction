[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmc"
version = "0.1.0"
description = "Recursive Memory Compaction — a continual-learning harness for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yi Hein Chai" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rmc = "rmc.cli:main"

[tool.setuptools.packages.find]
include = ["rmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
